# Applies only migration files newly added by a push:
#   release → staging      main → production
# Execute only newly added files and record their versions. This intentionally
# avoids db push over the repository's incomplete legacy migration history.
name: Supabase migrations

on:
  push:
    branches: [main, release]
    paths:
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Keep environment-specific secrets scoped to their target project.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    # Never migrate the same database twice at once, and never cancel a
    # migration halfway.
    concurrency:
      group: supabase-migrations-${{ github.ref_name == 'main' && 'production' || 'staging' }}
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ github.ref_name == 'main' && secrets.SUPABASE_PROD_DB_PASSWORD || secrets.SUPABASE_STAGING_DB_PASSWORD }}
      PROJECT_REF: ${{ github.ref_name == 'main' && secrets.SUPABASE_PROD_REF || secrets.SUPABASE_STAGING_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          # Keep in step with the "supabase" devDependency in package.json.
          version: 2.121.0

      - name: Collect new migration files
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "::error::Cannot determine the previous commit for this migration push."
            exit 1
          fi

          mapfile -t changes < <(git diff --name-status "$BEFORE_SHA" "$AFTER_SHA" -- supabase/migrations/)
          if (( ${#changes[@]} == 0 )); then
            echo "::error::The migration workflow was triggered without a migration file change."
            exit 1
          fi

          migration_files_file="$RUNNER_TEMP/new-migrations.txt"
          : > "$migration_files_file"

          for change in "${changes[@]}"; do
            IFS=$'\t' read -r status file <<< "$change"
            if [[ "$status" != "A" ]]; then
              echo "::error file=$file::Migration files are immutable. Add a new migration instead of editing or deleting an existing one."
              exit 1
            fi
            if [[ ! "$file" =~ ^supabase/migrations/[0-9]{14}_[A-Za-z0-9_-]+\.sql$ ]]; then
              echo "::error file=$file::Migration filename must start with a 14-digit timestamp."
              exit 1
            fi
            printf '%s\n' "$file" >> "$migration_files_file"
            echo "Queued migration: $file"
          done

      - name: Verify branch-specific credentials
        shell: bash
        env:
          PROD_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
          STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            expected_ref="khvvukyedvuqvbemjcxb"
            [[ -n "$PROD_DB_PASSWORD" ]] || { echo "::error::Production DB password secret is missing."; exit 1; }
          else
            expected_ref="mjominccvkwyintjsxja"
            [[ -n "$STAGING_DB_PASSWORD" ]] || { echo "::error::Staging DB password secret is missing."; exit 1; }
          fi

          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "::error::Supabase access token secret is missing."; exit 1; }
          [[ "$PROJECT_REF" == "$expected_ref" ]] || {
            echo "::error::Configured project ref does not match the target branch."
            exit 1
          }

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply new migrations and record versions
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            filename="${file##*/}"
            version="${filename%%_*}"
            echo "Applying $file to $PROJECT_REF"
            supabase db query --linked --file "$file"
            supabase migration repair --linked --status applied "$version"
          done < "$RUNNER_TEMP/new-migrations.txt"

# No Edge Functions job: the repo has no supabase/functions directory.
